<meta name="apple-mobile-web-app-capable" content="yes">

<body>
<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="词页首页">

      </span>
    </a>
    <nav class="nav" aria-label="主导航">
      <button class="nav-btn is-active" data-view="search">查词</button>
      <button class="nav-btn" data-view="saved">生词本<span class="nav-count" id="savedCount" hidden></span></button>
    </nav>
    <div class="top-actions">
      <button class="icon-btn" id="randomBtn" aria-label="随机一个词" title="随机一个词">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>

  </header>

  <main class="workspace" id="workspace">
    <aside class="panel" id="panel" aria-label="词条列表">
      <div class="search-box" id="searchBox">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
        <input id="q" type="search" placeholder="查一个词，或输入中文" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="查词">

      <div class="panel-head" id="panelHead"></div>
      <div class="word-list" id="list" role="list"></div>
      <div class="panel-foot" id="panelFoot"></div>
    </aside>

    <section class="reader" id="reader" aria-label="词条内容" tabindex="-1">
      <div class="reader-scroll" id="readerScroll"></div>
    </section>
  </main>
</div>

<div class="lesson" id="lesson" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="review" id="review" role="dialog" aria-modal="true" aria-label="复习生词" hidden></div>
